spring:
  application:
    name: student-attendance-api

  datasource:
    url: jdbc:h2:mem:student_attendance;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: true
      path: /h2-console

  servlet:
    multipart:
      enabled: true
      max-file-size: 25MB
      max-request-size: 50MB

server:
  port: 8081
  servlet:
    context-path: /api/v1

app:
  # Where uploaded files (course covers and materials) are stored on disk.
  # Resolved relative to the API process working directory.
  upload-dir: ./uploads

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
