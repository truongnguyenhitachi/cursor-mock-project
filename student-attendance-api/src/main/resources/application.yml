spring:
  application:
    name: student-attendance-api

  datasource:
    url: jdbc:h2:mem:student_attendance;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: true
      path: /h2-console

  servlet:
    multipart:
      enabled: true
      # Course materials max ~25 MB; videos can be large, so the cap is 200 MB
      # per file and 220 MB per request. Tune both to match your storage.
      max-file-size: 200MB
      max-request-size: 220MB

server:
  port: 8081
  servlet:
    context-path: /api/v1

app:
  # Where uploaded files (course covers and materials) are stored on disk.
  # Resolved relative to the API process working directory.
  upload-dir: ./uploads

  jwt:
    # IMPORTANT: change this in production. Must be at least 32 chars (256 bits)
    # because we sign with HS256.
    secret: dev-secret-change-me-please-this-must-be-256-bits-or-longer
    # Token lifetime (ISO-8601 duration). Defaults to 12 hours.
    expiration: PT12H
    issuer: student-attendance-api

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
